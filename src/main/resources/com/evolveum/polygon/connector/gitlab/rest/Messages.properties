connector.gitlab.rest.display=easyIGA GitLab REST Connector
baseUrl.display=GitLab base URL
baseUrl.help=Full HTTP or HTTPS GitLab base URL. /api/v4 is appended when absent.
privateToken.display=Private token
privateToken.help=Protected GitLab administrator personal access token with api scope.
connectTimeoutMillis.display=Connect timeout (milliseconds)
connectTimeoutMillis.help=Positive TCP connection timeout.
requestTimeoutMillis.display=Request timeout (milliseconds)
requestTimeoutMillis.help=Positive total timeout for each GitLab API request.
allowAccountDelete.display=Account hard delete safety latch
allowAccountDelete.help=Reserved safety switch. It must remain false; account hard delete is not implemented.
allowTopologyMutations.display=Allow topology mutations
allowTopologyMutations.help=Reserved safety switch. It must remain false; group and project topology changes are unsupported.
forceRandomPasswordOnCreate.display=Generate random account password
forceRandomPasswordOnCreate.help=Ask GitLab to generate a random password when no ConnId password is provided.
deprovisionDeveloperGroupPath.display=Managed Developer group path
deprovisionDeveloperGroupPath.help=Exact GitLab group full path whose direct Developer membership is removed when a managed account is disabled.
deprovisionMaintainerProjectPath.display=Managed Maintainer project path
deprovisionMaintainerProjectPath.help=Exact GitLab project path whose direct Maintainer membership is removed when a managed account is disabled.
eventLookbackDays.display=Event lookback window (days)
eventLookbackDays.help=Positive number of days before now; only project events after this cutoff are scanned for the last-use attributes.
maxProjectsPerGroup.display=Maximum projects scanned per group
maxProjectsPerGroup.help=Positive bound on the number of a group's projects read when computing Developer last-use; a group with more projects than this yields a partial signal.
integrationUsername.display=Dedicated integration administrator username
integrationUsername.help=Username of the dedicated GitLab instance administrator the token must belong to. Protected from account and membership mutation. Must not be root. Default: easyiga-midpoint.
integrationTokenName.display=Required integration token name
integrationTokenName.help=Exact name the personal access token must carry for Test Connection to pass. Default: easyiga-midpoint-connector.
